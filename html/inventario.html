<section class="flex" id="inventario">
<div class="col inventario-rolagens">
<h2>Rolagens</h2>
<div class="cartao-rolagem">
<h3>Teste de traço</h3>
<label for="rolagem-traco">Traço</label><select id="rolagem-traco" class="campo-inventario"><option value="">Selecione um traço</option><option value="traco-1">Sangue Quente</option><option value="traco-2">Mira Afiada</option><option value="traco-3">Guerreiro Ancestral</option><option value="traco-4">Amigo Kaboom</option><option value="traco-5">Orelha Em Pé</option><option value="traco-6">Passos Na Sombra</option><option value="traco-7">Poeira e Ossos</option><option value="traco-8">Rédea e Sela</option><option value="traco-9">Língua de Trapo</option><option value="traco-10">Agourento e Carrancudo</option><option value="traco-11">Cachola Cheia</option><option value="traco-12">Grande Maioral</option></select>
<label for="rolagem-bonus">Bônus / penalidade</label><select id="rolagem-bonus" class="campo-inventario"><option value="-3">-3</option><option value="-2">-2</option><option value="-1">-1</option><option value="0" selected>+0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option></select>
<button type="button" class="botao-rolar" data-rolagem="traco">🎲 Rolar traço</button>
<output id="resultado-traco" class="resultado-rolagem" aria-live="polite"></output>
</div>

<h2>Armas</h2>
<fieldset class="cartao-arma"><legend>Arma primária</legend><label for="arma-primaria">Nome</label><input class="campo-inventario" type="text" id="arma-primaria" placeholder="Nome da arma"><div class="bonus-distancias"><label class="bonus-distancia"><span>Corpo a corpo</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-primaria-corpo" aria-label="Bônus de Corpo a corpo da arma primária"></label><label class="bonus-distancia"><span>Curta</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-primaria-curta" aria-label="Bônus de Curta da arma primária"></label><label class="bonus-distancia"><span>Média</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-primaria-media" aria-label="Bônus de Média da arma primária"></label><label class="bonus-distancia"><span>Longa</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-primaria-longa" aria-label="Bônus de Longa da arma primária"></label></div></fieldset><fieldset class="cartao-arma"><legend>Arma secundária</legend><label for="arma-secundaria">Nome</label><input class="campo-inventario" type="text" id="arma-secundaria" placeholder="Nome da arma"><div class="bonus-distancias"><label class="bonus-distancia"><span>Corpo a corpo</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-secundaria-corpo" aria-label="Bônus de Corpo a corpo da arma secundária"></label><label class="bonus-distancia"><span>Curta</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-secundaria-curta" aria-label="Bônus de Curta da arma secundária"></label><label class="bonus-distancia"><span>Média</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-secundaria-media" aria-label="Bônus de Média da arma secundária"></label><label class="bonus-distancia"><span>Longa</span><input class="campo-inventario" type="number" min="-3" max="3" step="1" value="0" id="bonus-secundaria-longa" aria-label="Bônus de Longa da arma secundária"></label></div></fieldset>
</div>
<div class="col inventario-itens"><div class="inventario-cabecalho"><h2>Itens</h2><button type="button" class="botao-rolar" id="adicionar-item">+ Adicionar item</button></div>
<div class="tabela-itens-rolagem"><table class="tabela-itens"><thead><tr><th>Item</th><th>Quantidade</th><th>Tamanho</th><th>Descrição</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody id="lista-itens"></tbody></table></div>
</div></section>
