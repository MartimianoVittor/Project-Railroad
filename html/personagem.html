<section class="flex" id="personagem">
        <div class="col coluna-retrato">
            <form id="form-personagem" enctype="multipart/form-data">
                <label for="escolher-foto-personagem" class="label-retrato">
                    <div class="circulo-interno">
                        <img id="foto-personagem" class="imagem-exibida" src="assets/imgs/retrato-vazio.svg" alt="Clique para escolher a fotografia do personagem">
                        <span class="texto-hover">Trocar Imagem</span>
                    </div>
                </label>
                <input type="file" id="escolher-foto-personagem" accept="image/*" style="display: none;">
                <div class="campos-texto-container">
                    <div class="grupo-campo">
                        <label for="nome-personagem" class="label-campo">Nome:</label>
                        <input type="text" id="nome-personagem" name="nome-personagem" placeholder="Seu nome aqui.">
                    </div>
                    <div class="grupo-campo">
                        <label for="apelido-personagem" class="label-campo">Apelido:</label>
                        <input type="text" id="apelido-personagem" name="apelido-personagem" placeholder="Seu apelido aqui.">
                    </div>
                    <div class="grupo-campo">
                        <label for="profissao-personagem" class="label-campo">Profissão:</label>
                        <textarea id="profissao-personagem" name="profissao-personagem" rows="2" placeholder="Suas profissões."></textarea>
                    </div>
                    <div class="grupo-campo">
                        <label for="lingua-personagem" class="label-campo">Línguas:</label>
                        <textarea id="lingua-personagem" name="lingua-personagem" rows="2" placeholder="Seus idiomas."></textarea>
                    </div>
                </div>
            </form> 
        </div>
        <div class="col">
            <div class="campos-texto-container">
                <div class="campo-inline">
                    <label for="fama" class="label-campo">Fama:</label>
                    <input type="text" id="fama" placeholder="Sua Fama.">
                </div>
                <div class="campo-inline">
                    <label for="palavra" class="label-campo">Palavra:</label>
                    <input type="text" id="palavra" placeholder="Sua Palavra.">
                </div>
                <div class="campo-inline">
                    <label for="dinheiro" class="label-campo">Dinheiro:</label>
                    <input type="text" id="dinheiro" placeholder="Seu Dinheiro.">
                </div>
            </div>
            <div class="grupo-caveiras">
                <div class="linha-check">
                    <label>Ferimentos:</label>
                    <div class="caveiras-box">
                        <input type="checkbox" class="check-caveira" data-grupo="ferimentos" aria-label="Ferimentos 1">
                        <input type="checkbox" class="check-caveira" data-grupo="ferimentos" aria-label="Ferimentos 2">
                        <input type="checkbox" class="check-caveira" data-grupo="ferimentos" aria-label="Ferimentos 3">
                    </div>
                </div>
                <div class="linha-check">
                    <label>Sede:</label>
                    <div class="caveiras-box">
                        <input type="checkbox" class="check-caveira" data-grupo="sede" aria-label="Sede 1">
                        <input type="checkbox" class="check-caveira" data-grupo="sede" aria-label="Sede 2">
                        <input type="checkbox" class="check-caveira" data-grupo="sede" aria-label="Sede 3">
                    </div>
                </div>
                <div class="linha-check">
                    <label>Fome:</label>
                    <div class="caveiras-box">
                        <input type="checkbox" class="check-caveira" data-grupo="fome" aria-label="Fome 1">
                        <input type="checkbox" class="check-caveira" data-grupo="fome" aria-label="Fome 2">
                        <input type="checkbox" class="check-caveira" data-grupo="fome" aria-label="Fome 3">
                    </div>
                </div>
                <div class="linha-check">
                    <label>Cansaço:</label>
                    <div class="caveiras-box">
                        <input type="checkbox" class="check-caveira" data-grupo="cansaco" aria-label="Cansaço 1">
                        <input type="checkbox" class="check-caveira" data-grupo="cansaco" aria-label="Cansaço 2">
                        <input type="checkbox" class="check-caveira" data-grupo="cansaco" aria-label="Cansaço 3">
                    </div>
                </div>
            </div>
            <div class="campos-texto-container">
                <div class="grupo-campo">
                        <label for="bio-personagem" class="label-campo">Sobre Você:</label>
                        <textarea id="bio-personagem" name="bio-personagem" rows="14" placeholder="Fale sobre você."></textarea>
                    </div>
            </div>
        </div>
        <div class="col double">
            <div id="tracos-personagem" class="grupo-tracos"></div>
        </div>
    </section>
