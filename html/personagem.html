<section class="flex" id="personagem">
        <div class="col coluna-retrato">
            <form id="form-personagem" enctype="multipart/form-data">
                <label for="escolher-foto-personagem" class="label-retrato">
                    <div class="circulo-interno">
                        <img id="foto-personagem" class="imagem-exibida" src="assets/imgs/imagemPersonagemPlaceholder.png" alt="Clique para escolher a fotografia do personagem">
                        <span class="texto-hover">Trocar Imagem</span>
                    </div>
                </label>
                <input type="file" id="escolher-foto-personagem" accept="image/*" style="display: none;">
                <div class="campos-texto-container">
                    <div class="grupo-campo">
                        <label for="nome-personagem" class="label-campo">Nome:</label>
                        <input type="text" id="nome-personagem" name="nome-personagem" placeholder="Seu nome aqui.">
                    </div>
                    <div class="grupo-campo">
                        <label for="apelido-personagem" class="label-campo">Apelido:</label>
                        <input type="text" id="apelido-personagem" name="apelido-personagem" placeholder="Seu apelido aqui.">
                    </div>
                    <div class="grupo-campo">
                        <label for="profissao-personagem" class="label-campo">Profissão:</label>
                        <textarea id="profissao-personagem" name="profissao-personagem" rows="2" placeholder="Suas profissões."></textarea>
                    </div>
                    <div class="grupo-campo">
                        <label for="lingua-personagem" class="label-campo">Lingua:</label>
                        <textarea id="lingua-personagem" name="lingua-personagem" rows="2" placeholder="Seus idiomas."></textarea>
                    </div>
                </div>
            </form> 
        </div>
        <div class="col">
