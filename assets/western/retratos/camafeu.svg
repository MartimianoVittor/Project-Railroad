<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="6" id="hachura-camafeu" patterntransform="rotate(-45)" patternunits="userSpaceOnUse" width="6">
<line stroke="#1f140c" stroke-opacity="0.26" stroke-width="1.3" x1="0" x2="0" y1="0" y2="6"></line>
</pattern>
<pattern height="5" id="hachura-cobre-cam" patterntransform="rotate(-45)" patternunits="userSpaceOnUse" width="5">
<line stroke="#1f140c" stroke-opacity="0.3" stroke-width="1.4" x1="0" x2="0" y1="0" y2="5"></line>
</pattern>
</defs>
<!-- Placa base sutil de apoio com cantos chanfrados -->
<rect fill="#291b12" height="212" rx="18" stroke="#1f140c" stroke-width="3" width="212" x="14" y="14"></rect>
<rect fill="none" height="200" rx="14" stroke="#8c6424" stroke-dasharray="4 3" stroke-width="1.5" width="200" x="20" y="20"></rect>
<!-- Cantoneiras ornamentais de cobre nos 4 cantos -->
<path d="M 22 46 L 22 26 Q 22 22 26 22 L 46 22 L 38 30 L 30 30 L 30 38 Z" fill="#b85628" stroke="#1f140c" stroke-width="2"></path>
<path d="M 218 46 L 218 26 Q 218 22 214 22 L 194 22 L 202 30 L 210 30 L 210 38 Z" fill="#b85628" stroke="#1f140c" stroke-width="2"></path>
<path d="M 22 194 L 22 214 Q 22 218 26 218 L 46 218 L 38 210 L 30 210 L 30 202 Z" fill="#b85628" stroke="#1f140c" stroke-width="2"></path>
<path d="M 218 194 L 218 214 Q 218 218 214 218 L 194 218 L 202 210 L 210 210 L 210 202 Z" fill="#b85628" stroke="#1f140c" stroke-width="2"></path>
<!-- Argola superior (Passador do camafeu) -->
<ellipse cx="120" cy="14" fill="none" rx="14" ry="8" stroke="#1f140c" stroke-width="5"></ellipse>
<ellipse cx="120" cy="14" fill="none" rx="14" ry="8" stroke="#e6b84c" stroke-width="2.5"></ellipse>
<rect fill="#d9a738" height="10" rx="3" stroke="#1f140c" stroke-width="2.5" width="18" x="111" y="16"></rect>
<!-- Moldura externa recortada / festonada em latão -->
<circle cx="120" cy="118" fill="#d9a738" r="92" stroke="#1f140c" stroke-width="3.5"></circle>
<!-- Faixa de luz superior no aro -->
<path d="M 46 66 A 90 90 0 0 1 194 66 A 84 84 0 0 0 46 66 Z" fill="#f5d57a"></path>
<!-- Sombra inferior hachurada no aro externo -->
<path d="M 32 142 A 90 90 0 0 0 208 142 A 86 86 0 0 1 32 142 Z" fill="#a8791d"></path>
<circle cx="120" cy="118" fill="url(#hachura-camafeu)" r="90"></circle>
<!-- Anel intermediário trançado / cordão de cobre -->
<circle cx="120" cy="118" fill="none" r="79" stroke="#1f140c" stroke-width="2.5"></circle>
<circle cx="120" cy="118" fill="none" r="75.5" stroke="#b85628" stroke-width="5"></circle>
<circle cx="120" cy="118" fill="none" r="75.5" stroke="#1f140c" stroke-dasharray="3 5" stroke-width="5"></circle>
<!-- 8 Rebites ornamentais distribuídos ao redor do aro -->
<g fill="#f5d57a" stroke="#1f140c" stroke-width="2">
<circle cx="120" cy="34" r="3.8"></circle>
<circle cx="179" cy="59" r="3.8"></circle>
<circle cx="204" cy="118" r="3.8"></circle>
<circle cx="179" cy="177" r="3.8"></circle>
<circle cx="61" cy="177" r="3.8"></circle>
<circle cx="36" cy="118" r="3.8"></circle>
<circle cx="61" cy="59" r="3.8"></circle>
</g>
<!-- Bisel interno de latão polido -->
<circle cx="120" cy="118" fill="#e6b84c" r="71" stroke="#1f140c" stroke-width="2.5"></circle>
<!-- Janela circular central para a imagem do personagem -->
<circle cx="120" cy="118" fill="#e8d6b3" r="64" stroke="#1f140c" stroke-width="3"></circle>
<circle cx="120" cy="118" fill="none" r="59" stroke="#785328" stroke-dasharray="4 3" stroke-width="1.5"></circle>
<!-- Texto indicador -->
<text fill="#3b2614" font-family="'Rye', serif" font-size="11" text-anchor="middle" x="120" y="114">SUA IMAGEM</text>
<text fill="#3b2614" font-family="'Rye', serif" font-size="11" text-anchor="middle" x="120" y="129">AQUI</text>
<!-- Plaqueta inferior ornamentada com volutas -->
<path d="M 66 196 L 74 188 L 166 188 L 174 196 L 166 208 L 74 208 Z" fill="#b85628" stroke="#1f140c" stroke-width="2.5"></path>
<path d="M 66 196 L 74 188 L 166 188 L 174 196 L 166 208 L 74 208 Z" fill="url(#hachura-cobre-cam)"></path>
<circle cx="75" cy="198" fill="#f5d57a" r="2.2" stroke="#1f140c" stroke-width="1.2"></circle>
<circle cx="165" cy="198" fill="#f5d57a" r="2.2" stroke="#1f140c" stroke-width="1.2"></circle>
<text fill="#fff4d6" font-family="'Rye', serif" font-size="9.5" letter-spacing="1.2" text-anchor="middle" x="120" y="202">RETRATO</text>
</svg>