  <g fill="#fff0d2" opacity=".52">
    <circle cx="6" cy="6" r=".9"/><circle cx="49" cy="6" r=".9"/><circle cx="92" cy="6" r=".9"/>
    <circle cx="6" cy="49" r=".9"/><circle cx="92" cy="49" r=".9"/>
    <circle cx="6" cy="92" r=".9"/><circle cx="49" cy="92" r=".9"/><circle cx="92" cy="92" r=".9"/>
