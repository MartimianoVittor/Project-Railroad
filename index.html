<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Rye&family=Smokum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=1.3.3">
    <title>Railroad RPG — Jogador</title>
</head>
<body>
    <!-- Barra lateral é parte fixa da aplicação: disponível antes dos fragmentos. -->
    <aside class="barra-lateral" aria-label="Menu do jogador">
        <div class="marca-jogador">
            <strong class="logo">RAILROAD</strong>
            <span class="subtitulo-marca">Jogador</span>
        </div>
    
        <nav class="menu-navegacao" aria-label="Páginas da ficha">
            <a href="#jogador" class="btn-nav btn-cartucho ativa" data-aba="jogador" aria-current="page"><svg class="cartucho-svg" viewBox="0 0 180 64" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                    <defs>
                        <pattern id="hachura-cartucho-jogador" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                            <path d="M0 0V7" stroke="#28170d" stroke-width="2" stroke-opacity=".32" />
                        </pattern>
                        <pattern id="hachura-cartucho-jogador-ativa-jogador" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                            <path d="M0 0V7" stroke="#f5d376" stroke-width="2" stroke-opacity=".23" />
                        </pattern>
                        <clipPath id="recorte-cartucho-jogador">
                            <path d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" />
                        </clipPath>
                    </defs>
                    <path class="cartucho-sombra" d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" transform="translate(0 2)" />
                    <g class="cartucho-corpo" clip-path="url(#recorte-cartucho-jogador)">
                        <path class="c-estojo" d="M0 0H129V64H0Z" />
                        <path class="c-ogiva" d="M129 0H180V64H129Z" />
                        <path class="c-estojo-luz" d="M0 0H129V16H0Z" />
                        <path class="c-ogiva-luz" d="M129 0H180V16H129Z" />
                        <path class="cartucho-hachura" d="M2 36 C8 43 15 43 22 43 H129 C153 43 175 36 178 34 V64 H2Z" />
                        <path class="c-juncao" d="M129 0V64" />
                        <path class="c-culote" d="M12 0H18V64H12Z" />
                    </g>
                    <path class="c-contorno" d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" />
                </svg><span class="cartucho-texto">Jogador</span></a>
            <a href="#personagem" class="btn-nav btn-cartucho" data-aba="personagem"><svg class="cartucho-svg" viewBox="0 0 180 64" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                    <defs>
                        <pattern id="hachura-cartucho-personagem" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                            <path d="M0 0V7" stroke="#28170d" stroke-width="2" stroke-opacity=".32" />
                        </pattern>
                        <pattern id="hachura-cartucho-personagem-ativa-personagem" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                            <path d="M0 0V7" stroke="#f5d376" stroke-width="2" stroke-opacity=".23" />
                        </pattern>
                        <clipPath id="recorte-cartucho-personagem">
                            <path d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" />
                        </clipPath>
                    </defs>
                    <path class="cartucho-sombra" d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" transform="translate(0 2)" />
                    <g class="cartucho-corpo" clip-path="url(#recorte-cartucho-personagem)">
                        <path class="c-estojo" d="M0 0H129V64H0Z" />
                        <path class="c-ogiva" d="M129 0H180V64H129Z" />
                        <path class="c-estojo-luz" d="M0 0H129V16H0Z" />
                        <path class="c-ogiva-luz" d="M129 0H180V16H129Z" />
                        <path class="cartucho-hachura" d="M2 36 C8 43 15 43 22 43 H129 C153 43 175 36 178 34 V64 H2Z" />
                        <path class="c-juncao" d="M129 0V64" />
                        <path class="c-culote" d="M12 0H18V64H12Z" />
                    </g>
                    <path class="c-contorno" d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" />
                </svg><span class="cartucho-texto">Personagem</span></a>
            <a href="#inventario" class="btn-nav btn-cartucho" data-aba="inventario"><svg class="cartucho-svg" viewBox="0 0 180 64" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                    <defs>
                        <pattern id="hachura-cartucho-inventario" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                            <path d="M0 0V7" stroke="#28170d" stroke-width="2" stroke-opacity=".32" />
                        </pattern>
                        <pattern id="hachura-cartucho-inventario-ativa-inventario" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
                            <path d="M0 0V7" stroke="#f5d376" stroke-width="2" stroke-opacity=".23" />
                        </pattern>
                        <clipPath id="recorte-cartucho-inventario">
                            <path d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" />
                        </clipPath>
                    </defs>
                    <path class="cartucho-sombra" d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" transform="translate(0 2)" />
                    <g class="cartucho-corpo" clip-path="url(#recorte-cartucho-inventario)">
                        <path class="c-estojo" d="M0 0H129V64H0Z" />
                        <path class="c-ogiva" d="M129 0H180V64H129Z" />
                        <path class="c-estojo-luz" d="M0 0H129V16H0Z" />
                        <path class="c-ogiva-luz" d="M129 0H180V16H129Z" />
                        <path class="cartucho-hachura" d="M2 36 C8 43 15 43 22 43 H129 C153 43 175 36 178 34 V64 H2Z" />
                        <path class="c-juncao" d="M129 0V64" />
                        <path class="c-culote" d="M12 0H18V64H12Z" />
                    </g>
                    <path class="c-contorno" d="M7 2 H129 C151 2 178 17 178 32 C178 47 151 62 129 62 H7 Q2 62 2 57 V7 Q2 2 7 2Z" />
                </svg><span class="cartucho-texto">Inventário</span></a>
        </nav>
    
        <div class="acoes-ficha-aside">
            <p class="identificacao-ficha" id="ficha-atual"></p>
            <p class="status-salvamento" id="status-salvamento" role="status" aria-live="polite"></p>
            <div class="divisor-aside" aria-hidden="true"></div>
            <button type="button" id="btn-conta" class="btn-acao-lateral">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="8" r="3.5" />
                    <path d="M5 20v-2a7 7 0 0 1 14 0v2" />
                </svg>
                <span>Conta</span>
            </button>
            <button type="button" id="btn-minhas-fichas" class="btn-acao-lateral">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M7 3h8l4 4v14H7z" />
                    <path d="M15 3v5h4M10 12h6M10 16h6M4 7v14" />
                </svg>
                <span>Ficha</span>
            </button>
            <button type="button" id="btn-fichas-locais" class="btn-acao-lateral">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 7h7l2 2h9v11H3z" />
                    <path d="M12 11v6m-3-3 3 3 3-3" />
                </svg>
                <span>Local</span>
            </button>
        </div>
    </aside>

    <main id="area-fichas" aria-label="Fichas do jogador">
        <section id="jogador" class="pagina-ficha ativa" aria-label="Jogador e quadro de ideias">
            <div data-include="html/jogador.html" class="fragmento-coluna"></div>
            <div id="alvo-quadro-desktop" class="painel-quadro-jogador">
                <div data-include="html/quadro.html" class="fragmento-quadro"></div>
            </div>
        </section>
        <div data-include="html/personagem.html"></div>
        <div data-include="html/inventario.html"></div>
        <!-- O mesmo quadro é movido para cá apenas na versão mobile. -->
        <section id="quadro-mobile" class="pagina-ficha" aria-label="Quadro de ideias"></section>
    </main>

    <nav class="navegacao-mobile" aria-label="Navegação da ficha no celular">
        <a href="#jogador" class="aba-mobile ativa" data-aba="jogador"><span aria-hidden="true">♟</span><span>Jogador</span></a>
        <a href="#personagem" class="aba-mobile" data-aba="personagem"><span aria-hidden="true">★</span><span>Personagem</span></a>
        <a href="#inventario" class="aba-mobile" data-aba="inventario"><span aria-hidden="true">▤</span><span>Inventário</span></a>
        <a href="#quadro-mobile" class="aba-mobile" data-aba="quadro-mobile"><span aria-hidden="true">✎</span><span>Quadro</span></a>
        <button type="button" class="aba-mobile" id="abrir-acoes-mobile" aria-expanded="false" aria-controls="acoes-mobile"><span aria-hidden="true">☰</span><span>Ações</span></button>
    </nav>
    <div class="fundo-acoes-mobile" id="fundo-acoes-mobile" hidden></div>
    <div class="acoes-mobile" id="acoes-mobile" role="dialog" aria-label="Ações da ficha" aria-modal="true" hidden>
        <h2>Minha ficha</h2>
        <p class="identificacao-ficha" id="ficha-atual-mobile"></p>
        <p class="status-salvamento" id="status-salvamento-mobile" role="status" aria-live="polite"></p>
        <button type="button" class="btn-oeste" id="conta-mobile">Conta</button>
        <button type="button" class="btn-oeste" id="fichas-mobile">Ficha</button>
        <button type="button" class="btn-oeste" id="locais-mobile">Local</button>
        <button type="button" class="btn-oeste" id="fechar-acoes-mobile">Fechar</button>
    </div>

    <div data-include="html/dialogs/fichas.html"></div>
    <div data-include="html/dialogs/conta.html"></div>
    <div data-include="html/dialogs/local.html"></div>

    <script src="js/navegacao.js?v=1.2.5"></script>
    <script src="js/includes.js?v=1.2.5"></script>
</body>
</html>
